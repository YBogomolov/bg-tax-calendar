<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Данъчен календар</title>
    <meta
      name="description"
      content="Данъчни и осигурителни срокове за самоосигуряващи се лица по официалните календари на НАП."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Данъчен календар <span id="year-label"></span></h1>
        <p class="sub" id="subtitle">Срокове от официалните календари на Националната агенция за приходите (НАП)</p>
      </div>
      <nav class="actions">
        <select id="year-select" aria-label="Година" hidden></select>
        <details class="feeds">
          <summary class="btn">Абонамент за календар</summary>
          <div class="feeds-menu" id="feeds"></div>
        </details>
      </nav>
    </header>

    <section class="filters" aria-label="Филтри">
      <div class="segmented" id="view" role="radiogroup" aria-label="Изглед">
        <button type="button" data-value="self" role="radio">Самоосигуряващи се</button>
        <button type="button" data-value="all" role="radio">Всички срокове</button>
      </div>
      <div class="filter-group" id="self-filters">
        <div class="segmented" id="activity" role="radiogroup" aria-label="Вид дейност">
          <button
            type="button"
            data-value="freelancer"
            role="radio"
            title="Свободна професия, занаятчия и др. (чл. 29 ЗДДФЛ)"
          >
            Свободна професия
          </button>
          <button type="button" data-value="trader" role="radio" title="Едноличен търговец">
            Едноличен търговец (ЕТ)
          </button>
        </div>
        <label class="toggle"><input type="checkbox" id="opt-vat" /> Регистрация по ДДС</label>
        <label class="toggle"><input type="checkbox" id="opt-property" /> Данък върху недвижими имоти</label>
      </div>
      <div class="filter-group" id="all-filters">
        <div class="segmented" id="source" role="radiogroup" aria-label="Календар">
          <button type="button" data-value="all" role="radio">Всички</button>
          <button type="button" data-value="tax" role="radio">Данъци</button>
          <button type="button" data-value="social" role="radio">Осигуровки</button>
        </div>
        <div id="chips" class="chips" role="group" aria-label="Категории"></div>
      </div>
    </section>

    <main class="layout">
      <section class="overview" aria-label="Преглед на годината">
        <div id="months" class="months"></div>
        <p class="legend" id="legend"></p>
      </section>

      <aside class="panel" aria-live="polite">
        <div class="panel-head">
          <h2 id="panel-title">Предстоящи</h2>
          <button type="button" id="panel-back" class="link" hidden>← Предстоящи</button>
        </div>
        <div id="panel-body" class="panel-body"><p class="muted">Зареждане…</p></div>
      </aside>
    </main>

    <footer class="foot" id="foot"></footer>
  </body>
</html>
