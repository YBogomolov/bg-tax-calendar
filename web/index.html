<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Данъчен календар</title>
    <meta
      name="description"
      content="Данъчни и осигурителни срокове за самоосигуряващи се лица по официалните календари на НАП."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a
      class="github-corner"
      href="https://github.com/YBogomolov/bg-tax-calendar"
      aria-label="Изходен код в GitHub"
      title="Изходен код в GitHub"
      data-i18n-title="github"
      data-i18n-aria-label="github"
    >
      <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z" />
        <path
          class="octo-arm"
          fill="currentColor"
          d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
        />
        <path
          fill="currentColor"
          d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
        />
      </svg>
    </a>
    <header class="top">
      <div class="brand">
        <h1><span data-i18n="heading">Данъчен календар</span> <span id="year-label"></span></h1>
        <p class="sub" id="subtitle" data-i18n="subtitle">
          Срокове от официалните календари на Националната агенция за приходите (НАП)
        </p>
      </div>
      <nav class="actions">
        <select id="lang-select" aria-label="Език" data-i18n-aria-label="language"></select>
        <select id="year-select" aria-label="Година" data-i18n-aria-label="year" hidden></select>
        <details class="feeds">
          <summary class="btn" data-i18n="feeds">Абонамент за календар</summary>
          <div class="feeds-menu" id="feeds"></div>
        </details>
      </nav>
    </header>

    <section class="filters" aria-label="Филтри" data-i18n-aria-label="filters">
      <div class="segmented" id="view" role="radiogroup" aria-label="Изглед" data-i18n-aria-label="view">
        <button type="button" data-value="self" role="radio" data-i18n="viewSelf">Самоосигуряващи се</button>
        <button type="button" data-value="all" role="radio" data-i18n="viewAll">Всички срокове</button>
      </div>
      <div class="filter-group" id="self-filters">
        <div class="segmented" id="activity" role="radiogroup" aria-label="Вид дейност" data-i18n-aria-label="activity">
          <button
            type="button"
            data-value="freelancer"
            role="radio"
            title="Свободна професия, занаятчия и др. (чл. 29 ЗДДФЛ)"
            data-i18n="freelancer"
            data-i18n-title="freelancerHint"
          >
            Свободна професия
          </button>
          <button
            type="button"
            data-value="trader"
            role="radio"
            title="Едноличен търговец"
            data-i18n="trader"
            data-i18n-title="traderHint"
          >
            Едноличен търговец (ЕТ)
          </button>
        </div>
        <label class="toggle"
          ><input type="checkbox" id="opt-vat" /> <span data-i18n="vat">Регистрация по ДДС</span></label
        >
        <label class="toggle"
          ><input type="checkbox" id="opt-property" />
          <span data-i18n="property">Данък върху недвижими имоти</span></label
        >
      </div>
      <div class="filter-group" id="all-filters">
        <div class="segmented" id="source" role="radiogroup" aria-label="Календар" data-i18n-aria-label="calendar">
          <button type="button" data-value="all" role="radio" data-i18n="sourceAll">Всички</button>
          <button type="button" data-value="tax" role="radio" data-i18n="sourceTax">Данъци</button>
          <button type="button" data-value="social" role="radio" data-i18n="sourceSocial">Осигуровки</button>
        </div>
        <div id="chips" class="chips" role="group" aria-label="Категории" data-i18n-aria-label="categories"></div>
      </div>
    </section>

    <main class="layout">
      <section class="overview" aria-label="Преглед на годината" data-i18n-aria-label="overview">
        <div id="months" class="months"></div>
        <p class="legend" id="legend"></p>
      </section>

      <aside class="panel" aria-live="polite">
        <div class="panel-head">
          <h2 id="panel-title" data-i18n="upcoming">Предстоящи</h2>
          <button type="button" id="panel-back" class="link" data-i18n="back" hidden>← Предстоящи</button>
        </div>
        <div id="panel-body" class="panel-body"><p class="muted" data-i18n="loading">Зареждане…</p></div>
      </aside>
    </main>

    <footer class="foot" id="foot"></footer>
  </body>
</html>
