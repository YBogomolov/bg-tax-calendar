<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BG Tax Calendar</title>
  <meta name="description" content="Bulgarian tax and social-insurance deadlines from the official NRA calendars.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>BG Tax Calendar <span id="year-label"></span></h1>
      <p class="sub" id="subtitle">Deadlines from the official calendars of the National Revenue Agency (НАП)</p>
    </div>
    <nav class="actions">
      <select id="year-select" aria-label="Year" hidden></select>
      <details class="feeds">
        <summary class="btn">Calendar feeds</summary>
        <div class="feeds-menu" id="feeds"></div>
      </details>
    </nav>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="segmented" id="view" role="radiogroup" aria-label="View">
      <button type="button" data-value="self" role="radio">Self-employed</button>
      <button type="button" data-value="all" role="radio">All deadlines</button>
    </div>
    <div class="filter-group" id="self-filters">
      <div class="segmented" id="activity" role="radiogroup" aria-label="Type of activity">
        <button type="button" data-value="freelancer" role="radio" title="Свободна професия, занаятчия и др. (чл. 29 ЗДДФЛ)">Freelancer</button>
        <button type="button" data-value="trader" role="radio" title="Едноличен търговец">Sole trader (ЕТ)</button>
      </div>
      <label class="toggle"><input type="checkbox" id="opt-vat"> VAT-registered</label>
      <label class="toggle"><input type="checkbox" id="opt-property"> Property tax</label>
    </div>
    <div class="filter-group" id="all-filters">
      <div class="segmented" id="source" role="radiogroup" aria-label="Calendar">
        <button type="button" data-value="all" role="radio">All</button>
        <button type="button" data-value="tax" role="radio">Tax</button>
        <button type="button" data-value="social" role="radio">Social insurance</button>
      </div>
      <div id="chips" class="chips" role="group" aria-label="Categories"></div>
    </div>
  </section>

  <main class="layout">
    <section class="overview" aria-label="Year overview">
      <div id="months" class="months"></div>
      <p class="legend" id="legend"></p>
    </section>

    <aside class="panel" aria-live="polite">
      <div class="panel-head">
        <h2 id="panel-title">Upcoming</h2>
        <button type="button" id="panel-back" class="link" hidden>← Upcoming</button>
      </div>
      <div id="panel-body" class="panel-body"><p class="muted">Loading…</p></div>
    </aside>
  </main>

  <footer class="foot" id="foot"></footer>
</body>
</html>
